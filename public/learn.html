<!-- learn.html -->
<!DOCTYPE html>
<html>

<head>
    <title>Learn</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
            font-size: 38px;
        }

        iframe {
            width: 80%;
            height: 420px;
            border: none;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .card {
            max-width: 900px;
            margin: auto;
            background: linear-gradient(145deg, #f5f5f5, #d9d9d9);
            color: #111;
            padding: 30px;
            border-radius: 22px;
            text-align: left;
            margin-bottom: 25px;
        }

        .card h3 {
            margin-bottom: 12px;
        }

        .card p,
        .card li {
            margin: 8px 0;
            color: #333;
            line-height: 1.6;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 14px;
            background: #fff;
            color: #000;
            cursor: pointer;
            font-weight: 600;
            margin: 10px;
        }

        button:hover {
            transform: scale(1.05);
            transition: 0.3s;
        }
    </style>
</head>

<body>

    <h1 id="title"></h1>

    <iframe id="video" allowfullscreen></iframe>

    <div id="content" class="card"></div>

    <button onclick="goToQuestions()">Go to Questions ➡️</button>

    <script>
        const params = new URLSearchParams(window.location.search);
        const topic = params.get("topic") || "Programming";

        document.getElementById("title").innerText = topic;

        const videos = {
            OOP: "https://www.youtube.com/embed/pTB0EiLXUC8",
            Arrays: "https://www.youtube.com/embed/RBSGKlAvoiM",
            Java: "https://www.youtube.com/embed/eIrMbAQSU34",
            Python: "https://www.youtube.com/embed/rfscVS0vtbw"
        };

        document.getElementById("video").src =
            videos[topic] || "https://www.youtube.com/embed/8hly31xKli0";

        document.getElementById("content").innerHTML = `
            <h3>About ${topic}</h3>
            <p>${topic} is an important concept in programming used in interviews and real-world projects.</p>

            <h3>Benefits</h3>
            <ul>
                <li>Improves coding logic</li>
                <li>Used in software development</li>
                <li>Helps in placements</li>
                <li>Builds problem solving skills</li>
            </ul>
        `;

        function goToQuestions() {
            window.location.href = "questions.html?topic=" + topic;
        }
    </script>

</body>

</html>
