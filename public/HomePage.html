<!DOCTYPE html>
<html>

<head>
    <title>Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
        }

        .navbar h1 {
            font-size: 28px;
        }

        .navbar a {
            text-decoration: none;
            color: #fff;
            margin-left: 18px;
            padding: 10px 18px;
            border-radius: 12px;
            background: #111;
        }

        .hero {
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: linear-gradient(145deg, #f5f5f5, #d9d9d9);
            color: #111;
            padding: 45px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 255, 255, .12);
            max-width: 650px;
        }

        .card h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .card p {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }

        button {
            padding: 14px 26px;
            border: none;
            border-radius: 14px;
            background: #000;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>Creative Coding Playground</h1>

        <div>
            <a href="login.html">Login</a>
            <a href="explore.html">Explore</a>
        </div>
    </div>

    <div class="hero">
        <div class="card">
            <h1>Welcome 🚀</h1>
            <p>Practice coding and improve your skills with premium learning experience.</p>
            <button onclick="window.location.href='login.html'">Get Started</button>
        </div>
    </div>

</body>

</html>
