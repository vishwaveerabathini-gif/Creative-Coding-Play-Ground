<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            padding: 30px;
            min-height: 100vh;
        }

        .topbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .bell,
        .profile-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #fff;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
        }

        .bell {
            font-size: 24px;
            position: relative;
        }

        .profile-icon {
            font-size: 22px;
            font-weight: 700;
        }

        .profile-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            top: -4px;
            right: -2px;
            background: red;
            color: #fff;
            min-width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 4px;
        }

        .notifyBox {
            display: none;
            position: fixed;
            top: 95px;
            right: 30px;
            width: 350px;
            max-height: 420px;
            overflow: auto;
            background: #fff;
            color: #111;
            border-radius: 18px;
            padding: 18px;
            z-index: 1000;
        }

        .notifyItem {
            background: #f2f2f2;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .header p {
            color: #ccc;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: linear-gradient(145deg, #f5f5f5, #d9d9d9);
            color: #111;
            padding: 28px;
            border-radius: 22px;
            text-align: center;
            transition: .3s;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
        }

        .card h2 {
            margin-bottom: 12px;
        }

        .card p {
            margin-bottom: 15px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 14px;
            background: #000;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #222;
        }

        .stats {
            font-size: 22px;
            font-weight: 600;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="topbar">

        <div class="bell" onclick="toggleNotifications()">
            🔔
            <div class="badge" id="badge">0</div>
        </div>

        <div class="profile-icon" id="profileIcon" onclick="window.location.href='profile.html'">
            U
        </div>

    </div>

    <div class="notifyBox" id="notifyBox">
        <h3>Notifications</h3>
        <br>
        <div id="notifyList">No Notifications</div>
    </div>

    <div class="header">
        <h1 id="welcomeText">👋 Welcome User</h1>
        <p>Your coding progress starts here</p>
    </div>

    <div class="grid">

        <div class="card">
            <h2>🚀 Start Coding</h2>
            <p>Choose language and continue.</p>

            <button onclick="openLanguages()">
                Explore
            </button>
        </div>

        <div class="card">
            <h2>🏆 Leaderboard</h2>
            <p>Check top coders.</p>

            <button onclick="window.location.href='leaderboard.html'">
                View
            </button>
        </div>

        <div class="card">
            <h2>📊 Stats</h2>
            <div class="stats">Top Score: 950</div>
        </div>

    </div>

    <script>

        let currentUser =
            localStorage.getItem("currentUser") || "User";

        /* REMOVE CHAT ROOM FOR NORMAL QUESTIONS */
        function openLanguages() {

            localStorage.removeItem("chatRoomId");

            window.location.href = "languages.html";
        }

        /* PROFILE */
        async function loadProfile() {

            let res =
                await fetch("/profile/" + currentUser);

            let data = await res.json();

            welcomeText.innerText =
                "👋 Welcome " + data.username;

            if (data.profilePhoto) {

                profileIcon.innerHTML =
                    `<img src="${data.profilePhoto}">`;

            } else {

                profileIcon.innerText =
                    data.username.charAt(0).toUpperCase();
            }
        }

        /* NOTIFICATIONS */
        async function loadNotifications() {

            let res =
                await fetch("/notifications/" + currentUser);

            let data = await res.json();

            badge.innerText = data.length;

            if (data.length === 0) {

                notifyList.innerHTML =
                    "No Notifications";

                return;
            }

            let output = "";

            data.reverse().forEach(msg => {

                output += `
<div class="notifyItem">
${msg}
</div>`;
            });

            notifyList.innerHTML = output;
        }

        /* TOGGLE */
        function toggleNotifications() {

            if (notifyBox.style.display === "block") {
                notifyBox.style.display = "none";
            } else {
                notifyBox.style.display = "block";
            }
        }
        document.addEventListener("click", function (e) {

            let bell =
                document.querySelector(".bell");

            let notifyBox =
                document.getElementById("notifyBox");

            /* Bell clicked */
            if (bell.contains(e.target)) {
                return;
            }

            /* Clicked inside notification */
            if (notifyBox.contains(e.target)) {
                return;
            }

            /* Outside click */
            notifyBox.style.display = "none";
        });

        /* START */
        loadProfile();
        loadNotifications();

        setInterval(loadNotifications, 5000);

    </script>

</body>


</html>
