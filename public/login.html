<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            width: 420px;
            background: linear-gradient(145deg, #f5f5f5, #d9d9d9);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(255, 255, 255, .12);
            animation: drop .9s ease;
        }

        @keyframes drop {
            from {
                transform: translateY(-500px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h1 {
            text-align: center;
            color: #111;
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #444;
            margin-bottom: 25px;
        }

        .switch {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .switch button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            background: #ececec;
            color: #000;
        }

        .switch .active {
            background: #000;
            color: #fff;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: none;
            border-radius: 12px;
            background: #fff;
            font-size: 15px;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: #000;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: #222;
        }

        .small {
            text-align: center;
            margin-top: 15px;
            color: #333;
            font-size: 15px;
            margin-bottom: 0;
        }

        #errorMsg {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 0;
            min-height: 18px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1 id="title">Login</h1>
        <p id="subtitle">Welcome Back 👋</p>

        <div class="switch">
            <button id="loginBtn" class="active" onclick="showLogin()">Login</button>
            <button id="signupBtn" onclick="showSignup()">Sign Up</button>
        </div>

        <div id="formArea">

            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">

            <button class="submit-btn" onclick="login()">Login</button>

            <p id="errorMsg"></p>

            <p class="small">New here? Click Sign Up</p>

        </div>

    </div>

    <script>

        function showLogin() {

            document.getElementById("title").innerText = "Login";
            document.getElementById("subtitle").innerText = "Welcome Back 👋";

            document.getElementById("loginBtn").classList.add("active");
            document.getElementById("signupBtn").classList.remove("active");

            document.getElementById("formArea").innerHTML = `
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">

<button class="submit-btn" onclick="login()">Login</button>

<p id="errorMsg"></p>

<p class="small">New here? Click Sign Up</p>
`;

        }

        function showSignup() {

            document.getElementById("title").innerText = "Sign Up";
            document.getElementById("subtitle").innerText = "Create New Account 🚀";

            document.getElementById("signupBtn").classList.add("active");
            document.getElementById("loginBtn").classList.remove("active");

            document.getElementById("formArea").innerHTML = `
<input type="text" id="newuser" placeholder="Username">
<input type="password" id="newpass" placeholder="Password">

<button class="submit-btn" onclick="signup()">Create Account</button>

<p id="errorMsg"></p>

<p class="small">Already have account? Click Login</p>
`;

        }

        function login() {

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            document.getElementById("errorMsg").innerText = "";

            fetch("https://creative-coding-play-ground.onrender.com/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ username, password })
            })
                .then(res => res.json())
                .then(data => {

                    if (data.msg === "Login success") {
                        localStorage.setItem("currentUser", username);
                        window.location.href = "dashboard.html";
                    } else {
                        document.getElementById("errorMsg").innerText = "The entered password is not correct";
                    }

                });

        }
        function signup() {

            const username = document.getElementById("newuser").value.trim();
            const password = document.getElementById("newpass").value.trim();

            let users = JSON.parse(localStorage.getItem("users")) || [];

            if (users.includes(username)) {
                document.getElementById("errorMsg").innerText =
                    "Username already exists";
                return;
            }

            fetch("https://creative-coding-play-ground.onrender.com/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ username, password })
            })
                .then(res => res.json())
                .then(data => {

                    if (data.msg === "Signup successful") {

                        users.push(username);
                        localStorage.setItem("users", JSON.stringify(users));

                        showLogin();

                        document.getElementById("errorMsg").innerText =
                            "Account created successfully. Please login.";

                    }

                });

        }


    </script>

</body>

</html>
